services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-AscentDemo!2026}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
      DATABASE_PATH: /data/ascent.db
    volumes:
      - ascent-data:/data
    restart: unless-stopped
volumes:
  ascent-data:
